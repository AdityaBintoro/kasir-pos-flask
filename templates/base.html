<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Kasir POS</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-emerald-50/50 font-sans text-gray-800 min-h-screen flex flex-col overflow-x-hidden">

    <!-- Navigation Bar Utama -->
    <nav class="bg-emerald-800 px-4 py-3 sm:p-4 text-white shadow-sm border-b border-emerald-900">
        <div class="max-w-6xl mx-auto flex flex-col gap-3 sm:flex-row sm:justify-between sm:items-center">
            <a href="/" class="text-lg sm:text-xl font-bold tracking-wide flex items-center gap-2">
                🏪 POS Toko
            </a>
            <div class="flex flex-wrap items-center gap-x-5 gap-y-2 text-xs sm:text-sm font-medium">
                <a href="/" class="hover:text-emerald-200 transition">Kasir</a>
                <a href="/produk" class="hover:text-emerald-200 transition">Kelola Produk</a>
                <a href="/riwayat" class="hover:text-emerald-200 transition">Riwayat Transaksi</a>
            </div>
        </div>
    </nav>

    <!-- Konten Halaman -->
    <main class="max-w-6xl mx-auto w-full px-3 py-4 sm:p-6 flex-grow">
        <!-- Notifikasi Pesan (Sukses / Error) -->
        {% if session.get('error') %}
        <div
            class="bg-red-50 border border-red-300 text-red-700 px-4 py-3 rounded-xl mb-4 shadow-sm flex items-center gap-2">
            <span>⚠️</span>
            <div>{{ session.pop('error') }}</div>
        </div>
        {% endif %}

        {% if session.get('sukses') %}
        <div
            class="bg-emerald-100 border border-emerald-400 text-emerald-800 px-4 py-3 rounded-xl mb-4 shadow-sm flex items-center gap-2">
            <span>✅</span>
            <div>{{ session.pop('sukses') }}</div>
        </div>
        {% endif %}

        {% block content %}{% endblock %}
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
